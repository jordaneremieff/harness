<!doctype html>
<html lang="en" data-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Pi · Web harness</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/web/app.js"></script>
</head>
<body>
<a id="skip-composer" class="skip-link" href="#primary-editor">Skip to message box</a>
<div id="app" class="app">
<nav id="sidebar" class="sidebar" aria-label="Conversations">
<button id="project-button" class="project-button" type="button" title="Choose project or session"><span id="project-name">open a project</span></button>
<section class="nav-section primary-section" aria-labelledby="primary-heading">
<h2 id="primary-heading" class="sr-only">Primary</h2>
<button id="primary-row" class="nav-row primary-row" type="button"><span id="primary-row-state" class="state-glyph" aria-hidden="true"></span><span id="primary-row-title" class="row-title">no session</span><span id="primary-row-meta" class="row-meta"></span></button>
</section>
<section id="roster-section" class="nav-section roster-section" aria-labelledby="agents-heading">
<h2 id="agents-heading" class="nav-heading">agents <span id="agent-count" class="count"></span></h2>
<label class="sr-only" for="agent-search">Filter agents</label><input id="agent-search" class="nav-filter" type="search" autocomplete="off" spellcheck="false" hidden>
<div id="roster" class="roster" role="list" aria-labelledby="agents-heading"></div>
<div id="roster-footer" class="roster-footer"></div>
</section>
<section id="agent-message-panel" class="agent-message-panel" aria-labelledby="agent-message-name" hidden>
<header class="message-panel-head"><h2 id="agent-message-name"></h2><button id="agent-message-close" type="button" aria-label="Close message panel" title="Close message panel">×</button></header>
<p class="message-panel-identity"><code id="agent-message-identity"></code></p>
<p id="agent-message-status" class="message-panel-status" role="status"></p>
</section>
<footer class="sidebar-foot">
<div id="connection" class="connection" role="status" aria-live="polite"></div>
<button id="notices-button" type="button" aria-label="Notifications" hidden><span id="notices-count"></span> notices</button>
<button id="commands-button" class="palette-hint" type="button" aria-haspopup="dialog" aria-label="Commands" title="Commands (⌘K)">⌘K</button>
</footer>
</nav>
<main id="workspace" class="workspace">
<button id="sidebar-show" class="sidebar-show" type="button" aria-label="Show sidebar" aria-controls="sidebar" aria-expanded="false" title="Show sidebar" hidden>▸</button>
<div id="workspace-alert" class="workspace-alert" role="status" hidden></div>
<section id="primary" class="conversation" aria-labelledby="session-title">
<h1 id="session-title" class="sr-only">Pi</h1>
<div id="primary-view-notice" class="availability" role="status"></div>
<div class="transcript-actions"><button id="primary-earlier" type="button" hidden>↑ earlier</button></div>
<div class="transcript-region">
<p id="primary-empty" class="empty-state" hidden><span id="primary-empty-caption">no session · ⌘K or click the project name</span></p>
<div id="primary-transcript" class="transcript" tabindex="0" aria-label="Primary messages"></div>
<button id="primary-latest" class="latest" type="button" hidden>↓ latest</button>
</div>
<div id="primary-widgets-above" class="widgets"></div>
<form id="primary-composer" class="composer">
<p id="primary-activity" class="exception" role="status"></p>
<div id="primary-receipt" class="receipt" role="status"></div>
<div class="composer-input">
<div id="primary-command-menu" class="command-menu" hidden></div>
<label class="sr-only" for="primary-editor">Message to primary</label>
<textarea id="primary-editor" rows="1" spellcheck="false" aria-autocomplete="list" aria-controls="primary-command-menu"></textarea>
</div>
<div class="composer-line">
<div id="primary-status" class="statusline"><button id="model-button" type="button" disabled>model</button><button id="thinking-button" type="button" hidden></button><span id="primary-usage" class="fact"></span><span id="extension-status" class="fact"></span><span id="primary-save" class="draft-state"></span><span id="primary-receipt-details" class="receipt-details"></span></div>
<div class="composer-bar">
<div id="primary-modes" class="modes" role="group" aria-label="Delivery while working" hidden><button type="button" data-mode="steer" aria-pressed="true">steer</button><button type="button" data-mode="followUp" aria-pressed="false">follow-up</button></div>
<span id="primary-caption" class="caption"></span>
<button type="button" id="primary-stop" class="stop" hidden title="Stop work and clear queued input">stop</button>
<button id="primary-send" type="submit" class="send" disabled aria-label="Send" title="Send (Enter)">↵</button>
</div>
</div>
</form>
<div id="primary-widgets-below" class="widgets"></div>
</section>
<section id="agent-detail" class="conversation" aria-labelledby="agent-name" hidden>
<h1 id="agent-name" class="sr-only" tabindex="-1"></h1>
<div id="agent-facts" class="facts-panel"></div>
<div id="agent-view-notice" class="availability" role="status"></div>
<div class="transcript-actions"><button id="agent-earlier" type="button" hidden>↑ earlier</button></div>
<div class="transcript-region">
<div id="agent-transcript" class="transcript" tabindex="0" aria-label="Agent messages"></div>
<button id="agent-latest" class="latest" type="button" hidden>↓ latest</button>
</div>
<p id="agent-availability" class="exception" role="status"></p>
<form id="agent-composer" class="composer">
<div id="agent-receipt" class="receipt" role="status"></div>
<div class="composer-input">
<label class="sr-only" for="agent-editor">Message to this agent</label>
<textarea id="agent-editor" rows="1" spellcheck="false"></textarea>
</div>
<div class="composer-line">
<div class="statusline"><span id="agent-status" class="fact"></span><span id="agent-save" class="draft-state"></span><span id="agent-receipt-details" class="receipt-details"></span></div>
<div class="composer-bar">
<div id="agent-modes" class="modes" role="group" aria-label="Delivery while working"><button type="button" data-mode="steer" aria-pressed="false">steer</button><button type="button" data-mode="followUp" aria-pressed="true">follow-up</button></div>
<span id="agent-caption" class="caption"></span>
<button type="button" id="agent-abort" class="stop" hidden>abort</button>
<button id="agent-acquire" type="button" hidden>open through primary</button>
<button id="agent-send" type="submit" class="send" disabled aria-label="Send" title="Send (Enter)">↵</button>
</div>
</div>
</form>
</section>
</main>
</div>
<div id="announcements" class="sr-only" role="status" aria-live="polite"></div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-heading"><h2 id="modal-title"></h2><button id="modal-close" type="button" aria-label="Close dialog">×</button></div><div id="modal-body"></div><div id="modal-error" class="error" role="alert"></div></dialog>
</body>
</html>
