<!doctype html>
<html lang="en" data-appearance="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Pi · Web harness</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<script type="module" src="/web/app.js"></script>
</head>
<body>
<a id="skip-composer" class="skip-link" href="#primary-editor">Skip to message box</a>
<div id="app" class="app">
<div id="connection" class="connection-banner" role="status" aria-live="polite" hidden></div>
<div class="workbench">
<nav id="sidebar" class="sidebar" aria-label="Navigation">
<div class="nav-top"><span id="project-name" class="project-context">Working folder</span><button id="project-button" class="icon-button project-button" type="button" data-control-icon="folder" title="Choose working folder" aria-label="Choose working folder" aria-haspopup="menu" aria-expanded="false"><span class="sr-only">Choose working folder</span></button><button id="sidebar-close" class="icon-button sidebar-close" type="button" data-control-icon="close" aria-label="Hide navigation" title="Hide navigation"><span class="sr-only">Hide navigation</span></button></div>
<section id="sidebar-conversations" class="nav-section sidebar-conversations" aria-label="Conversations"></section>
<section id="files-section" class="nav-section files-section" aria-labelledby="files-heading">
<div class="nav-heading-row"><h2 class="nav-heading"><button id="files-heading" class="section-toggle" type="button" aria-expanded="true" aria-controls="files-section-body">Files</button></h2><div class="nav-heading-actions"><button id="files-refresh" class="icon-button" type="button" data-control-icon="restart" aria-label="Refresh files" title="Refresh files"><span class="sr-only">Refresh files</span></button></div></div>
<div id="files-section-body" class="section-body"><div id="files-tree"></div></div>
</section>
<section id="primary-section" class="nav-section primary-section" aria-label="Saved sessions">
<div class="nav-heading-row"><button id="session-open" class="session-catalog" type="button" aria-label="Find saved session" title="Find saved session">Saved sessions</button><div class="nav-heading-actions session-entry-actions"><button id="session-new" type="button" data-control-icon="plus" aria-label="New session" title="New session"><span class="sr-only">New session</span></button></div></div>
<div id="primary-section-body" class="section-body"><button id="primary-row" class="nav-row primary-row" type="button"><span id="primary-row-state" class="state-glyph" aria-hidden="true"></span><span id="primary-row-title" class="row-title">no session</span><span id="primary-row-meta" class="row-meta"></span></button>
</div>
</section>
<section id="roster-section" class="nav-section roster-section" aria-labelledby="agents-heading">
<div class="nav-heading-row"><h2 class="nav-heading"><button id="agents-heading" class="section-toggle" type="button" aria-expanded="true" aria-controls="agents-section-body">Agent catalog</button></h2><div class="nav-heading-actions"><button id="agent-refresh" class="icon-button" type="button" data-control-icon="restart" aria-label="Refresh agent roster" title="Refresh agent roster"><span class="sr-only">Refresh agent roster</span></button><button id="agent-new" class="icon-button" type="button" data-control-icon="agent" aria-label="New agent through primary" title="New agent through primary"><span class="sr-only">New agent through primary</span></button></div></div>
<div id="agents-section-body" class="section-body roster-body">
<div class="nav-search"><span class="search-icon" data-control-icon="search" aria-label="Filter agents"></span><label class="sr-only" for="agent-search">Filter agents</label><input id="agent-search" class="nav-filter" type="search" placeholder="Filter agents" autocomplete="off" spellcheck="false"></div>
<div id="roster" class="roster" role="list" aria-labelledby="agents-heading"></div>
<div id="roster-footer" class="roster-footer"></div>
</div>
</section>
<section id="agent-message-panel" class="agent-message-panel" aria-labelledby="agent-message-name" hidden>
<div id="message-panel-resizer" class="resizer" data-axis="y" tabindex="0" role="separator" aria-orientation="horizontal" aria-label="Resize Message panel" aria-controls="agent-message-panel"></div>
<header class="message-panel-head"><h2 id="agent-message-name"></h2><button id="agent-message-close" type="button" data-control-icon="close" aria-label="Close message panel" title="Close message panel"><span class="sr-only">Close message panel</span></button></header>
<p class="message-panel-identity"><code id="agent-message-identity"></code></p>
<p class="message-panel-status" role="status"><span id="agent-message-status"></span><button id="agent-message-retry" type="button" hidden disabled></button></p>
</section>

<footer class="sidebar-footer" aria-label="Workbench controls"><button id="commands-button" class="icon-button" type="button" aria-haspopup="dialog" data-control-icon="commands" aria-label="Commands" title="Commands"><span class="sr-only">Commands</span></button><button id="notifications-button" class="icon-button notifications-button" type="button" aria-haspopup="dialog" data-control-icon="notifications" aria-label="Notifications" title="Notifications"><span class="sr-only">Notifications</span><span id="notices-count" class="notices-count" aria-hidden="true" hidden></span></button><button id="appearance-button" class="icon-button" type="button" aria-haspopup="dialog" data-control-icon="appearance" aria-label="Appearance" title="Appearance"><span class="sr-only">Appearance</span></button></footer>
<div id="sidebar-resizer" class="resizer" data-axis="x" tabindex="0" role="separator" aria-orientation="vertical" aria-label="Resize sidebar" aria-controls="sidebar"></div>
</nav>
<main id="workspace" class="workspace">
<div id="navigation-access" class="navigation-access"><button id="sidebar-show" class="icon-button navigation-toggle" type="button" aria-controls="sidebar" aria-expanded="false" data-control-icon="navigation" aria-label="Show navigation" title="Show navigation"><span class="sr-only">Show navigation</span></button><span id="compact-project-name" class="project-context compact-project-context">Working folder</span><button id="compact-project-button" class="icon-button compact-project-button" type="button" data-control-icon="folder" title="Choose working folder" aria-label="Choose working folder" aria-haspopup="menu" aria-expanded="false"><span class="sr-only">Choose working folder</span></button></div>
<div id="tabs-empty" class="empty-state" hidden><p>No conversation selected.</p><button id="tabs-open-session" type="button">Sessions</button><button id="tabs-open-primary" type="button">Return to Primary</button></div>
<section id="session-chooser" class="inline-session-chooser" aria-label="Session chooser" hidden></section>
<div id="conversation-panes" class="conversation-panes pane-tree" data-focus-only="false"></div>
</main>
</div>
<dialog id="modal" aria-labelledby="modal-title"><div class="modal-heading"><h2 id="modal-title"></h2><button id="modal-close" type="button" data-control-icon="close" aria-label="Close dialog" title="Close dialog"><span class="sr-only">Close dialog</span></button></div><div id="modal-body"></div><div id="modal-error" class="error" role="alert"></div></dialog>
<footer id="workbench-status" class="workbench-status" aria-label="Focused conversation status">
<span id="workbench-scope" class="workbench-scope"></span><span id="workbench-activity" class="workbench-activity"></span>
<div id="focused-composer-status" class="workbench-draft-state"></div>
<div id="workbench-status-primary" class="workbench-status-facts" data-pane="primary" hidden>
<div class="workbench-model"><button id="model-button" type="button" disabled>Model</button><button id="thinking-button" type="button" hidden></button></div>

<details id="primary-usage-details" class="composer-details workbench-status-details" hidden><summary><span id="primary-context"></span><span id="primary-usage-summary" class="composer-summary-secondary"></span><span class="composer-details-label" data-control-icon="info" aria-label="Status details">Details</span></summary><div class="composer-detail-body"><div id="primary-usage" class="usage-details"></div><p id="primary-folder" hidden></p><section class="composer-extension"><p>Extension status</p><span id="extension-status" class="fact"></span></section></div></details>
</div>
<div id="workbench-status-agent" class="workbench-status-facts" data-pane="agent" hidden>
<span id="agent-status" class="agent-settings"></span>

<details id="agent-usage-details" class="composer-details workbench-status-details" hidden><summary><span id="agent-usage-summary"></span><span class="composer-details-label" data-control-icon="info" aria-label="Status details">Details</span></summary><div class="composer-detail-body"><p id="agent-usage-note"></p><div id="agent-usage" class="usage-details"></div><p id="agent-folder" hidden></p></div></details>
</div>
<button id="workbench-version" class="workbench-version" type="button" aria-label="Copy UI version identity"></button>
</footer>
</div>
<section id="access-view" class="access-view" aria-labelledby="access-title" hidden><div><h1 id="access-title">This browser is not signed in.</h1><p>Use the browser window started by the UI command on this Mac.</p><p>A new UI start prints a fresh, one-use launch link.</p><button id="access-retry" type="button">Check access</button><details><summary>Details</summary><pre id="access-error"></pre></details></div></section>
<div id="announcements" class="sr-only" role="status" aria-live="polite"></div>
</body>
</html>
