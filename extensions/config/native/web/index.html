<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Config</title>
  <link rel="stylesheet" href="./styles/config.css">
  <script type="module" src="./app/ui/main.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round"><path d="M4 6h8m4 0h4M4 12h3m4 0h9M4 18h10m4 0h2"/><circle cx="14" cy="6" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="16" cy="18" r="2"/></svg><strong>Config</strong></div>
    <label class="search"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="5.5"/><path d="m15 15 4 4"/></svg><input id="search" type="search" aria-label="Find a setting" placeholder="Find a setting…" autocomplete="off" spellcheck="false"><kbd aria-hidden="true">⌘F</kbd></label>
    <button id="close" type="button" class="icon" aria-label="Close Config" title="Close Config (⌘W)"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="m7 7 10 10m0-10L7 17"/></svg></button>
  </header>
  <div class="contextbar">
    <div class="context"><span id="target">Connecting…</span><span id="cwd"></span><span id="trust"></span></div>
    <label class="scope">Pi scope <select id="scope" disabled><option value="global">Global</option><option value="project">Project</option></select></label>
  </div>
  <div class="workspace">
    <nav id="nav" aria-label="Settings sections"></nav>
    <main><div class="content">
      <div id="heading" class="section"></div>
      <div id="body" aria-busy="true"><p class="empty">Waiting for the catalogue from Pi.</p></div>
    </div></main>
  </div>
  <footer>
    <div class="status"><span id="pending">No pending changes</span><span id="notice" role="status"></span></div>
    <div class="actions"><button id="revert" type="button" disabled>Revert</button><button id="review" type="button" disabled>Review</button><button id="save" type="button" class="primary" disabled>Save</button></div>
  </footer>
  <dialog id="dialog" aria-labelledby="dialog-title"><div class="dialog-head"><h2 id="dialog-title"></h2><button id="dismiss" class="icon" type="button" aria-label="Close dialog">×</button></div><div id="dialog-body"></div></dialog>
</body>
</html>
