<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Composer</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/composer.css">
<link rel="stylesheet" href="styles/menus.css">
<script defer src="app/composer/logic.js"></script>
<script defer src="app/composer/assistance.js"></script>
<script defer src="app/composer/controls.js"></script>
<script defer src="app/composer/layout.js"></script>
<script defer src="app/composer/page.js"></script>
</head>
<body>
<main class="composer" id="composer" data-connection="connecting">
 <section class="panel" id="panel" aria-label="Message composer">
  <div class="writer" id="writer">
   <div id="queued" class="queued" hidden></div>
   <label class="sr" for="input">Message to Pi</label>
   <div class="edit-area"><div id="highlight" aria-hidden="true"></div><textarea id="input" rows="1" placeholder="Message" aria-describedby="hint" autocapitalize="off" autocorrect="off" spellcheck="true" enterkeyhint="send"></textarea></div>
   <textarea id="measure" tabindex="-1" aria-hidden="true" inert readonly></textarea>
   <div id="images" class="images"></div>
   <p class="sr" id="hint">Press Return to send, or Shift-Return for a new line.</p>
   <div class="shelf">
    <button class="tool square add" id="add" type="button" aria-label="Add to message" aria-expanded="false" data-tip="Add to message"></button>
    <div class="model-controls">
     <button class="tool" id="model" type="button" disabled aria-label="Choose model and thinking level" aria-expanded="false"><span id="model-name">Model</span><span id="thinking-level"></span></button>
    </div>
    <div class="actions">
     <button class="tool square" id="mode" type="button" aria-label="Switch to queue" hidden></button>
     <button class="action square" id="action" type="button" aria-label="Send message" data-tip="Send ⏎"></button>
    </div>
   </div>
  </div>
  <footer class="status">
   <div class="run-strip" id="run-strip">
   <span class="status-icon" id="status-icon" aria-hidden="true"></span>
   <span id="notice" role="status" hidden></span>
   <button id="dismiss-notice" type="button" class="tool square" aria-label="Dismiss notice" data-tip="Dismiss notice" hidden></button>
   <span class="status-text" id="status-text" role="status">Connecting…</span>
   <span class="status-state" id="status-state" hidden></span>
   <span class="run-time" id="elapsed" hidden></span>
   <button class="choice return" id="return" type="button" aria-label="Go to terminal" data-tip="Go to terminal" hidden></button>
  </div>
   <div class="status-info">
    <span class="context" id="context" hidden><span id="context-meter" role="meter" aria-valuemin="0" aria-valuemax="100" aria-label="Context used"></span><span id="context-percent"></span><span id="context-tokens"></span></span>
    <span id="session-cost" hidden></span>
    <span id="session-folder" hidden></span>
   </div>
  </footer>
 </section>
</main>
<div class="composer-menu" id="menu" popover="manual" role="group" hidden></div>
<div class="tooltip" id="tooltip" aria-hidden="true" hidden></div>
</body>
</html>
