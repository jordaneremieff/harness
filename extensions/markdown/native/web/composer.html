<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Composer</title>
<link rel="stylesheet" href="styles/tokens.css">
<link rel="stylesheet" href="styles/composer.css">
<script defer src="app/composer/logic.js"></script>
<script defer src="app/composer/assistance.js"></script>
<script defer src="app/composer/controls.js"></script>
<script defer src="app/composer/page.js"></script>
</head>
<body>
<main class="composer" id="composer" data-connection="connecting">
 <section class="panel" id="panel" aria-label="Message composer">
  <div class="run-strip">
   <span class="status-dot" aria-hidden="true"></span>
   <span class="status-text" id="status-text" role="status">Connecting…</span>
   <span class="status-state" id="status-state" hidden></span>
   <span class="run-time" id="elapsed" hidden></span>
   <span class="run-keys" id="run-keys" hidden>
    <span><kbd>esc</kbd> stop</span>
    <span><kbd id="run-send-key">⏎</kbd> <span id="run-send-mode">steer</span></span>
    <span><kbd>⌥⏎</kbd> <span id="run-alt-mode">queue</span></span>
   </span>
   <button class="choice" id="edit-queued" type="button" hidden>Edit queued<span id="queued-count"></span></button>
   <button class="choice return" id="return" type="button" hidden>Go to terminal</button>
   <button class="choice" id="recovery" type="button" hidden></button>
  </div>
  <div class="writer" id="writer">
   <div id="queued" class="queued" hidden></div>
   <label class="sr" for="input">Message to Pi</label>
   <div class="edit-area"><div id="highlight" aria-hidden="true"></div><textarea id="input" rows="3" placeholder="Message Pi…" aria-describedby="hint" autocapitalize="off" autocorrect="off" spellcheck="true" enterkeyhint="send"></textarea></div>
   <div id="images" class="images"></div>
   <p class="sr" id="hint">Press Return to send, or Shift-Return for a new line.</p>
   <div class="shelf">
    <button class="tool square add" id="add" type="button" aria-label="Add to message" aria-expanded="false" data-tip="Add to message"></button>
    <div class="model-controls">
     <button class="tool" id="model" type="button" disabled aria-label="Choose model" aria-expanded="false"><span id="model-full">Model</span><span id="model-short">Model</span></button>
     <button class="tool" id="thinking" type="button" disabled aria-label="Choose thinking level" aria-expanded="false"><span id="model-level"></span></button>
    </div>
    <div class="actions">
     <button class="tool square" id="mode" type="button" aria-label="Switch to queue" hidden></button>
     <button class="action square" id="action" type="button" aria-label="Send message" data-tip="Send ⏎"></button>
    </div>
   </div>
  </div>
  <footer class="status">
   <div class="status-info">
    <span class="context" id="context" hidden><meter id="context-meter" min="0" max="100" aria-label="Context used"></meter><span id="context-percent"></span><span id="context-tokens"></span></span>
    <span id="session-cost" hidden></span>
    <span id="session-folder" hidden></span>
   </div>
   <button class="tool square" id="close" type="button" aria-label="Close composer" data-tip="Close composer"></button>
  </footer>
 </section>
</main>
<div class="notice" id="notice" role="status" hidden></div>
<div class="composer-menu" id="menu" role="group" hidden></div>
<div class="tooltip" id="tooltip" aria-hidden="true" hidden></div>
</body>
</html>
